<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Curtain · Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --ink: #090e22; --panel: #151c3d; --edge: #2c3a78; --text: #e8ecff; --dim: #97a2d6; --gold: #ffd54a; --w: #3f78e8; --e: #d93a48; --ok: #7be08f; --bad: #ff8f8f; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--text); font: 17px/1.4 "Pixelify Sans", system-ui, sans-serif; padding: 16px; }
h1, h2, .px, button { font-family: "Press Start 2P", monospace; }
h1 { font-size: 14px; color: var(--gold); margin: 0 0 14px; }
h2 { font-size: 10px; color: var(--gold); margin: 0 0 10px; }
.px { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 2px solid var(--edge); padding: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
label { font-size: 15px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
select, input { background: #0c1230; color: var(--text); border: 2px solid var(--edge); padding: 8px; font: inherit; font-size: 16px; min-width: 110px; }
button { background: #1d2760; color: var(--text); border: 2px solid #5b6fd0; border-bottom-width: 4px; padding: 9px 11px; font-size: 9px; cursor: pointer; line-height: 1.4; }
button:active { transform: translateY(2px); border-bottom-width: 2px; }
button.go { background: var(--gold); color: #1a1300; border-color: #fff3b0; }
button.warn { background: #6a1c2a; border-color: #d9606e; }
button.sm { padding: 6px 8px; font-size: 8px; }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tbl { border: 2px solid var(--edge); background: #10173a; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.tbl.playing { border-color: #4a6ad8; } .tbl.over { border-color: var(--ok); } .tbl.gate { border-color: var(--gold); }
.seat { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-left: 6px solid var(--w); background: #0c1230; }
.seat.E { border-left-color: var(--e); }
.chip { font-size: 14px; padding: 2px 8px; border: 2px solid var(--edge); }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.bad { color: var(--bad); border-color: var(--bad); } .chip.gold { color: var(--gold); border-color: var(--gold); }
.dim { color: var(--dim); }
#login { max-width: 360px; margin: 14vh auto 0; }
.big { font-size: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>IRON CURTAIN · TEACHER CONTROL</h1>

  <div class="card" id="login">
    <h2>TEACHER PIN</h2>
    <div class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="go" id="go">ENTER</button></div>
    <p class="dim" id="loginMsg"></p>
  </div>

  <div id="app" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><span class="px dim">Class code</span> <span class="big" id="code" style="color:var(--gold)"></span><br><span class="dim" id="joinUrl"></span><br><span class="dim" id="projUrl"></span></div>
        <div class="row">
          <button class="go" id="startAll">START ALL TABLES</button>
          <button class="go" id="next">NEXT TURN (ALL)</button>
          <button id="forceAll">FORCE END OF TURN (ALL)</button>
          <button class="warn" id="resetAll">RESET ALL TABLES</button>
          <button id="projAll">PROJECTOR: SHOW ALL</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>SETTINGS</h2>
      <div class="row">
        <label>Game version
          <select id="mode"><option value="focus">Focused (lesson content, 7 turns)</option><option value="full">Full (bonus history + Berlin boss)</option></select></label>
        <label>Turn pacing
          <select id="pace"><option value="teacher">Teacher starts each turn</option><option value="auto">Automatic</option></select></label>
        <label>Turn timer (seconds, 0 = none)
          <input id="timer" type="number" min="0" max="1800" step="30"></label>
        <label>Number of tables
          <input id="tables" type="number" min="1" max="12"></label>
        <button id="save">SAVE SETTINGS</button>
      </div>
      <p class="dim" style="margin:8px 0 0">Version and timer apply when a table starts or a turn begins. Table count can only change before any table starts. Tables with one human seat play against the bot.</p>
    </div>

    <div class="tables" id="tbls"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let ws, L = null, pin = '';
const room = (new URLSearchParams(location.search).get('room') || 'main').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24) || 'main';
$('#code').textContent = room.toUpperCase();
$('#joinUrl').textContent = 'Students open: ' + location.origin + '/' + (room === 'main' ? '' : '?room=' + room);
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + encodeURIComponent(room));
  ws.onopen = () => ws.send(JSON.stringify({ t: 'hello', role: 'teacher', pin }));
  ws.onmessage = (ev) => {
    if (ev.data === 'pong') return; const m = JSON.parse(ev.data);
    if (m.t === 'denied') { $('#loginMsg').textContent = m.msg; $('#login').hidden = false; $('#app').hidden = true; try { sessionStorage.removeItem('ic_pin'); } catch (e) {} return; }
    if (m.t === 'lobby' && m.teacher) { L = m; $('#login').hidden = true; $('#app').hidden = false; try { sessionStorage.setItem('ic_pin', pin); } catch (e) {} render(); }
  };
  ws.onclose = () => { setTimeout(() => { if (pin) connect(); }, 1500); };
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 20000);
}
const cmd = (c, extra) => ws.send(JSON.stringify(Object.assign({ t: 'tcmd', cmd: c }, extra || {})));
$('#go').onclick = () => { pin = $('#pin').value; connect(); };
$('#pin').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
$('#projUrl').textContent = 'Projector: ' + location.origin + '/projector.html' + (room === 'main' ? '' : '?room=' + room);
$('#projAll').onclick = () => cmd('spot', { table: null });
$('#startAll').onclick = () => cmd('start', { table: 'all' });
$('#next').onclick = () => cmd('next');
$('#forceAll').onclick = () => { if (confirm('Force every running table to end its current step?')) cmd('force', { table: 'all' }); };
$('#resetAll').onclick = () => { if (confirm('Reset ALL tables back to the lobby? Seats are kept, games are lost.')) cmd('reset', { table: 'all' }); };
$('#save').onclick = () => { cmd('cfg', { cfg: { mode: $('#mode').value, pace: $('#pace').value, timer: +$('#timer').value, tables: +$('#tables').value } }); };
let cfgShown = false;
const STAGE = { lobby: 'Waiting to start', acting: 'Players are acting', between: 'Reading results', gate: 'Waiting for you', berlin: 'Berlin boss battle', over: 'Finished' };
function seatHTML(t, side) {
  const s = t.seats[side], nm = side === 'W' ? 'WEST' : 'EAST';
  let chip;
  if (s) chip = s.conn ? '<span class="chip ok">connected</span>' : '<span class="chip bad">disconnected</span>';
  else if (t.bot[side] && t.stage !== 'lobby') chip = '<span class="chip gold">bot plays this side</span>';
  else chip = '<span class="chip dim">empty (a bot fills it on start)</span>';
  let flag = '';
  if (t.stage === 'acting') flag = t.ready[side] ? '<span class="chip ok">ready</span>' : '<span class="chip">thinking</span>';
  if (t.stage === 'between' || (t.stage === 'berlin' && t.ack && t.ack[side])) flag = t.ack[side] ? '<span class="chip ok">done</span>' : '<span class="chip">reading</span>';
  const btns = s ? '<button class="sm warn" data-kick="' + t.id + ':' + side + '">KICK</button>' : '';
  return '<div class="seat ' + side + '"><span class="px">' + nm + '</span><span class="row" style="gap:6px">' + chip + flag + btns + '</span></div>';
}
function render() {
  if (!cfgShown) { $('#mode').value = L.cfg.mode; $('#pace').value = L.cfg.pace; $('#timer').value = L.cfg.timer; $('#tables').value = L.cfg.tables; cfgShown = true; }
  const act = document.activeElement && document.activeElement.closest && document.activeElement.closest('#tbls');
  let h = '';
  for (const t of L.tables) {
    const cls = t.stage === 'gate' ? 'gate' : t.stage === 'over' ? 'over' : t.stage === 'lobby' ? '' : 'playing';
    h += '<div class="tbl ' + cls + '"><div class="row" style="justify-content:space-between"><span class="px" style="color:var(--gold)">' + esc(t.name) + '</span><span class="dim">' + STAGE[t.stage] + '</span></div>';
    h += seatHTML(t, 'W') + seatHTML(t, 'E');
    if (t.turn != null) {
      h += '<div class="dim">Turn ' + (t.turn + 1) + ': ' + esc(t.title || '') + '</div><div class="row"><span class="chip">Score W ' + t.score.W + ' : ' + t.score.E + ' E</span><span class="chip">Doctrine steps W' + t.docs.W + ' E' + t.docs.E + '</span>' + (t.alt ? '<span class="chip gold">' + t.alt + ' divergence' + (t.alt > 1 ? 's' : '') + '</span>' : '') + '</div>';
    }
    h += '<div class="row">';
    if (t.stage === 'lobby') h += '<button class="go sm" data-start="' + t.id + '">START</button>';
    h += '<button class="sm" data-spot="' + t.id + '">PROJECT</button>'; if (t.stage !== 'lobby') { h += '<button class="sm" data-force="' + t.id + '">FORCE STEP</button>'; h += '<button class="sm warn" data-reset="' + t.id + '">RESET</button>'; }
    h += '</div></div>';
  }
  $('#tbls').innerHTML = h;
  document.querySelectorAll('[data-spot]').forEach((b) => b.onclick = () => cmd('spot', { table: +b.dataset.spot }));
  document.querySelectorAll('[data-start]').forEach((b) => b.onclick = () => cmd('start', { table: +b.dataset.start }));
  document.querySelectorAll('[data-force]').forEach((b) => b.onclick = () => cmd('force', { table: +b.dataset.force }));
  document.querySelectorAll('[data-reset]').forEach((b) => b.onclick = () => { if (confirm('Reset this table?')) cmd('reset', { table: +b.dataset.reset }); });
  document.querySelectorAll('[data-kick]').forEach((b) => b.onclick = () => { const [id, side] = b.dataset.kick.split(':'); cmd('kick', { table: +id, side }); });
}
try { pin = sessionStorage.getItem('ic_pin') || ''; if (pin) connect(); } catch (e) {}
</script>
</body>
</html>
