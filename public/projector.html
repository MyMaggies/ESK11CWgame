<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Curtain · Projector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --ink: #090e22; --panel: #121a3a; --edge: #2c3a78; --text: #e8ecff; --dim: #97a2d6; --gold: #ffd54a; --w: #3f78e8; --e: #d93a48; --ok: #7be08f; --bad: #ff8f8f; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
body { font: 500 clamp(14px, 1.45vw, 26px)/1.35 "Pixelify Sans", system-ui, sans-serif; display: flex; flex-direction: column; padding: 1.2vw 1.6vw; gap: 1vw; }
.px { font-family: "Press Start 2P", monospace; text-transform: uppercase; letter-spacing: .04em; }
header { display: flex; align-items: center; gap: 2vw; }
header h1 { margin: 0; font-size: clamp(14px, 1.7vw, 32px); color: var(--gold); white-space: nowrap; }
.bar { flex: 1; display: flex; flex-direction: column; gap: .4vw; min-width: 0; }
.bar .lbl { display: flex; justify-content: space-between; font-size: clamp(10px, .95vw, 18px); }
.bar .lbl .w { color: #8fb4ff; } .bar .lbl .e { color: #ff9aa4; }
.track { height: 1.6vw; background: #1a1f3f; border: .2vw solid var(--edge); display: flex; }
.track .wb { background: var(--w); transition: width .8s; } .track .eb { background: var(--e); transition: width .8s; flex: 1; }
.join { text-align: right; color: var(--dim); font-size: clamp(11px, 1.05vw, 20px); white-space: nowrap; }
.join b { color: var(--gold); font-weight: 700; }
main { flex: 1; min-height: 0; }
.grid { height: 100%; display: grid; gap: 1vw; }
.card { background: var(--panel); border: .2vw solid var(--edge); padding: .8vw; display: flex; flex-direction: column; gap: .5vw; min-height: 0; min-width: 0; }
.card.over { border-color: var(--ok); } .card.berlin { border-color: #ff9a4a; }
.card canvas { width: 100%; flex: 1; min-height: 0; image-rendering: pixelated; object-fit: contain; background: #102042; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .6vw; }
.nm { font-size: clamp(9px, .85vw, 16px); color: var(--gold); }
.score { font-size: clamp(14px, 1.7vw, 32px); }
.score .w { color: #8fb4ff; } .score .e { color: #ff9aa4; }
.dim { color: var(--dim); } .small { font-size: clamp(11px, 1vw, 19px); }
.dot { display: inline-block; width: .9vw; height: .9vw; border-radius: 50%; background: #555; margin-right: .3vw; }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); } .dot.bot { background: var(--gold); }
.chip { display: inline-block; border: .15vw solid var(--edge); padding: 0 .5vw; margin: 0 .3vw .3vw 0; font-size: clamp(10px, .9vw, 17px); }
.chip.w { border-color: var(--w); } .chip.e { border-color: var(--e); } .chip.ok { border-color: var(--ok); color: var(--ok); } .chip.dv { border-color: var(--gold); color: var(--gold); }
.spot { height: 100%; display: grid; grid-template-columns: 1.7fr 1fr; gap: 1.2vw; }
.spot .map { display: flex; flex-direction: column; gap: .6vw; min-height: 0; }
.spot .side { display: flex; flex-direction: column; gap: .8vw; min-height: 0; overflow: hidden; }
.spot .big { font-size: clamp(22px, 3.2vw, 60px); }
h2 { margin: 0; font-size: clamp(10px, 1vw, 19px); color: var(--gold); font-family: "Press Start 2P", monospace; }
ul { margin: 0; padding-left: 1.2em; } li { margin-bottom: .25em; }
.legend { display: flex; gap: 1.4vw; font-size: clamp(11px, 1vw, 19px); color: var(--dim); }
.legend i { display: inline-block; width: 1vw; height: 1vw; margin-right: .4vw; vertical-align: -.1vw; }
#conn { position: fixed; right: 1vw; bottom: .6vw; font-size: clamp(9px, .8vw, 15px); color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1 class="px">IRON CURTAIN<br>1945-49</h1>
  <div class="bar">
    <div class="lbl px"><span class="w">WEST BLOC <span id="tw">0</span></span><span class="dim">ALL TABLES COMBINED</span><span class="e"><span id="te">0</span> EAST BLOC</span></div>
    <div class="track"><div class="wb" id="wb" style="width:50%"></div><div class="eb"></div></div>
  </div>
  <div class="join" id="join"></div>
</header>
<main id="main"></main>
<div id="conn">connecting...</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const room = (new URLSearchParams(location.search).get('room') || 'main').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24) || 'main';
$('#join').innerHTML = 'Join on your iPad<br><b>' + esc(location.host) + '</b>' + (room === 'main' ? '' : '<br>class code <b>' + esc(room) + '</b>');
let MAP = null, P = null;
const COL = { W: '#3f78e8', E: '#d93a48', N: '#aa9f5c', none: '#4d5580', sea: '#102042', swiss: '#8c8fa3', fin: '#aa9f5c' };
const STAGE = { lobby: 'WAITING TO START', acting: 'PLAYERS ACTING', between: 'READING RESULTS', gate: 'TURN COMPLETE', berlin: 'BERLIN BOSS BATTLE', over: 'FINISHED' };

function drawMap(cv, ctrl, t) {
  if (!MAP) return; const rows = MAP.length, cols = MAP[0].length; const ts = Math.max(4, t || 8);
  if (cv.width !== cols * ts || cv.height !== rows * ts) { cv.width = cols * ts; cv.height = rows * ts; }
  const g = cv.getContext('2d'); g.fillStyle = COL.sea; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = MAP[y][x]; if (ch === '.') continue;
    let c;
    if (ch === 'z') c = COL.swiss;
    else if (ctrl && ctrl[ch] === 'W') c = COL.W;
    else if (ctrl && ctrl[ch] === 'E') c = COL.E;
    else if (ctrl && ctrl[ch] === 'N') c = COL.N;
    else c = ctrl ? COL.none : '#232c55';
    g.fillStyle = c; g.fillRect(x * ts, y * ts, ts, ts);
    if ((x * 7 + y * 13) % 5 === 0) { g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x * ts, y * ts, ts / 2, ts / 2); }
  }
  // coast
  g.fillStyle = 'rgba(5,8,24,.55)';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) { if (MAP[y][x] === '.') continue; if (x + 1 >= cols || MAP[y][x + 1] === '.') g.fillRect(x * ts + ts - 1, y * ts, 1, ts); if (y + 1 >= rows || MAP[y + 1][x] === '.') g.fillRect(x * ts, y * ts + ts - 1, ts, 1); }
}
function seatDots(t) {
  const d = (side) => { const s = t.seats[side]; if (s) return '<i class="dot ' + (s.conn ? 'on' : 'off') + '"></i>'; return t.bot[side] && t.stage !== 'lobby' ? '<i class="dot bot"></i>' : '<i class="dot"></i>'; };
  return '<span class="small dim">W ' + d('W') + ' E ' + d('E') + '</span>';
}
function totals() {
  const w = P.totals.W, e = P.totals.E; $('#tw').textContent = w; $('#te').textContent = e;
  $('#wb').style.width = (w + e ? Math.round(100 * w / (w + e)) : 50) + '%';
}
function renderGrid() {
  const n = P.tables.length; const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 6 ? 3 : n <= 8 ? 4 : n <= 12 ? 4 : 5; const rows = Math.ceil(n / cols);
  let h = '<div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr)">';
  for (const t of P.tables) {
    const cls = t.stage === 'over' ? 'over' : t.stage === 'berlin' ? 'berlin' : '';
    h += '<div class="card ' + cls + '"><div class="row"><span class="nm px">' + esc(t.name) + '</span>' + seatDots(t) + '</div>';
    h += '<canvas id="c' + t.id + '"></canvas>';
    if (t.score) {
      h += '<div class="row"><span class="score px"><span class="w">' + t.score.W + '</span> : <span class="e">' + t.score.E + '</span></span><span class="small dim" style="text-align:right">' + esc(t.date) + '<br>' + esc(t.title) + '</span></div>';
      h += '<div class="small">' + (t.alt ? '<span class="chip dv">' + t.alt + ' timeline divergence' + (t.alt > 1 ? 's' : '') + '</span>' : '<span class="chip ok">timeline on track</span>') + (t.stage === 'acting' ? '<span class="chip' + (t.ready.W ? ' w' : '') + '">W ' + (t.ready.W ? 'ready' : 'thinking') + '</span><span class="chip' + (t.ready.E ? ' e' : '') + '">E ' + (t.ready.E ? 'ready' : 'thinking') + '</span>' : '<span class="chip">' + STAGE[t.stage] + '</span>') + '</div>';
    } else h += '<div class="small dim">' + STAGE[t.stage] + '</div>';
    h += '</div>';
  }
  h += '</div>';
  $('#main').innerHTML = h;
  for (const t of P.tables) { const cv = $('#c' + t.id); if (cv) drawMap(cv, t.ctrl, 7); }
}
function renderSpot(t) {
  let h = '<div class="spot"><div class="map card"><div class="row"><span class="px big" style="color:var(--gold)">' + esc(t.name) + '</span>' + seatDots(t) + '</div><canvas id="sc"></canvas>' +
    '<div class="legend"><span><i style="background:' + COL.W + '"></i>West controls</span><span><i style="background:' + COL.E + '"></i>East controls</span><span><i style="background:' + COL.none + '"></i>Contested</span><span><i style="background:' + COL.N + '"></i>Neutral</span></div></div>';
  h += '<div class="side">';
  if (t.score) {
    h += '<div class="card"><div class="row"><span class="score big px"><span class="w">' + t.score.W + '</span> : <span class="e">' + t.score.E + '</span></span><span class="dim" style="text-align:right">' + esc(t.date) + '<br>' + esc(t.title) + '</span></div>';
    h += '<div class="small dim">Regions W ' + t.score.regW + ' / E ' + t.score.regE + ' · Bonus points W ' + t.score.vpW + ' / E ' + t.score.vpE + '</div></div>';
    h += '<div class="card"><h2>DOCTRINES ENACTED</h2><div><span class="small" style="color:#8fb4ff">WEST</span> ' + (t.docs.W.length ? t.docs.W.map((x) => '<span class="chip w">' + esc(x) + '</span>').join('') : '<span class="dim small">none yet</span>') + '</div><div><span class="small" style="color:#ff9aa4">EAST</span> ' + (t.docs.E.length ? t.docs.E.map((x) => '<span class="chip e">' + esc(x) + '</span>').join('') : '<span class="dim small">none yet</span>') + '</div></div>';
    h += '<div class="card"><h2>HISTORY CHECK (LATEST)</h2>' + (t.anchors.length ? t.anchors.slice(-5).map((a) => '<div class="small"><span class="chip ' + (a.ok ? 'ok' : 'dv') + '">' + (a.ok ? 'HELD' : 'DIVERGED') + '</span>' + esc(a.title) + '</div>').join('') : '<div class="small dim">No checkpoints judged yet.</div>') + '</div>';
    h += '<div class="card" style="flex:1;overflow:hidden"><h2>WHAT REALLY HAPPENED NOW</h2><div class="small">' + esc(t.body || '') + '</div></div>';
  } else h += '<div class="card"><div class="px dim">' + STAGE[t.stage] + '</div></div>';
  h += '</div></div>';
  $('#main').innerHTML = h;
  drawMap($('#sc'), t.ctrl, 20);
}
function render() {
  if (!P || !MAP) return; totals();
  const t = P.spot != null ? P.tables.find((x) => x.id === P.spot) : null;
  if (t) renderSpot(t); else renderGrid();
}
fetch('/map.json').then((r) => r.json()).then((m) => { MAP = m; render(); });
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + encodeURIComponent(room));
  ws.onopen = () => { $('#conn').textContent = ''; ws.send(JSON.stringify({ t: 'hello', role: 'projector' })); setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 20000); };
  ws.onmessage = (ev) => { if (ev.data === 'pong') return; const m = JSON.parse(ev.data); if (m.t === 'proj') { P = m; render(); } };
  ws.onclose = () => { $('#conn').textContent = 'reconnecting...'; setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
